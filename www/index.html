<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Crizon</title>
<link href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-400-normal.css" rel="stylesheet" media="print" onload="this.media='all'">
<link href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-500-normal.css" rel="stylesheet" media="print" onload="this.media='all'">
<link href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-600-normal.css" rel="stylesheet" media="print" onload="this.media='all'">
<link href="https://cdn.jsdelivr.net/fontsource/fonts/inter@latest/latin-700-normal.css" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/cinzel@5.0.0/index.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:#000}
#app{position:fixed;inset:0;overflow:hidden;background:#000}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;overflow:hidden;background:#fff;animation:slideIn 0.22s ease}
@keyframes slideIn{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:translateX(0)}}
.toast{position:fixed;top:calc(env(safe-area-inset-top,8px) + 12px);left:50%;transform:translateX(-50%) translateY(-20px);background:rgba(30,30,30,0.95);color:#fff;padding:11px 20px;border-radius:22px;font-size:13px;font-weight:500;opacity:0;transition:all 0.3s;z-index:9999;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.bw-badge{position:fixed;top:calc(env(safe-area-inset-top,8px) + 8px);right:8px;background:rgba(0,0,0,0.55);color:#fff;font-size:10.5px;padding:4px 8px;border-radius:10px;z-index:9999;display:none}
.bw-badge.show{display:block}
.native-confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:99999;display:flex;align-items:center;justify-content:center;padding:24px;animation:fadeIn 0.15s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.native-confirm-box{background:#fff;border-radius:14px;max-width:320px;width:100%;padding:20px 20px 12px;box-shadow:0 10px 40px rgba(0,0,0,0.35)}
.native-confirm-msg{font-size:15px;color:#111;margin-bottom:18px;line-height:1.4;font-weight:500}
.native-confirm-actions{display:flex;justify-content:flex-end;gap:4px}
.native-confirm-btn{background:none;border:none;color:#075E54;font-weight:700;font-size:13.5px;letter-spacing:0.3px;padding:9px 14px;border-radius:6px;cursor:pointer}
.native-confirm-btn:active{background:rgba(7,94,84,0.1)}
.native-confirm-btn.danger{color:#d32f2f}
</style>
</head>
<body>
<div id="app" aria-label="Crizon app"></div>
<div class="toast" id="toast"></div>
<div class="bw-badge" id="bwBadge"></div>

<script src="native-bridge.js"></script>
<script defer src="app.bundle.js"></script>
</body>
</html>
