function showConfirm(message,{okText='OK',cancelText='Cancel',danger=false}={}){
  return new Promise(resolve=>{
    const overlay=document.createElement('div');

function initials(n){return (n||'?').split(' ').filter(Boolean).map(x=>x[0]).slice(0,2).join('').toUpperCase();}
function timeShort(ts){return new Date(ts).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:true});}
function timeAgo(ts){if(!ts)return '';const d=Date.now()-ts;const m=Math.floor(d/60000);if(m<1)return 'now';if(m<60)return m+'m';const h=Math.floor(m/60);if(h<24)return h+'h';const dd=Math.floor(h/24);if(dd<7)return dd+'d';return new Date(ts).toLocaleDateString('en-GB',{day:'2-digit',month:'short'});}
function lastSeenText(ts){
  if(!ts)return 'offline';
  const d=new Date(ts), now=new Date();
  const sameDay=d.getFullYear()===now.getFullYear()&&d.getMonth()===now.getMonth()&&d.getDate()===now.getDate();
  const y=new Date(now);y.setDate(now.getDate()-1);
  const yesterday=d.getFullYear()===y.getFullYear()&&d.getMonth()===y.getMonth()&&d.getDate()===y.getDate();
  const at=d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',hour12:true});
  if(sameDay)return 'last seen today at '+at;
  if(yesterday)return 'last seen yesterday at '+at;
  const date=d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:d.getFullYear()===now.getFullYear()?undefined:'numeric'});
  return 'last seen '+date+' at '+at;
}

// Keep a conversation visible for both users as soon as either side sends a message.
async function ensureChatContact(contact){
  if(!S.user||!contact?.uid||!contact?.username)return;
  const meRef=doc(db,'users',S.user.uid);
  try{
    const me=await getDoc(meRef);
    const mine=Array.isArray(me.data()?.contacts)?me.data().contacts:[];
    if(!mine.some(x=>sameUser(x,contact.username))){
      await updateDoc(meRef,{contacts:[...mine,contact.username]});
    }
  }catch{}
  try{
    const otherRef=doc(db,'users',contact.uid);
    const other=await getDoc(otherRef);
    if(other.exists()){
      const theirs=Array.isArray(other.data()?.contacts)?other.data().contacts:[];
      if(!theirs.some(x=>sameUser(x,S.user.username))){
        await updateDoc(otherRef,{contacts:[...theirs,S.user.username]});
      }
    }
  }catch{}
}

function clUpload(file,onP){return new Promise((res,rej)=>{const f=new FormData();f.append('file',file);f.append('upload_preset',CFG.cloudinary.uploadPreset);const x=new XMLHttpRequest();x.open('POST',CFG.cloudinary.uploadUrl);x.upload.onprogress=e=>{if(e.lengthComputable&&onP)onP(Math.round(e.loaded/e.total*100));};x.onload=()=>{try{const j=JSON.parse(x.responseText);if(j.secure_url)res({url:j.secure_url,publicId:j.public_id,bytes:j.bytes||0,resourceType:j.resource_type||'image'});else rej(new Error(j.error?.message||'Upload failed'));}catch(e){rej(e);}};x.onerror=()=>rej(new Error('Network error'));x.send(f);});}

const mediaCache=new Map();
const voiceRates=new Map(); // per-message playback speed (1, 1.5, 2)
// Persistent (survives app restart / chat reopen) local media store, backed
// by IndexedDB. `mediaCache` above only holds blob: URLs for the CURRENT
// page session — those go dead on restart, which was why a voice note that
// played fine right after sending would show a stuck loading spinner again
// after closing and reopening the app. This is the fix: the actual file
// bytes are saved here once (on send, and on receive), so re-opening a chat
// never needs the network (or a Cloudinary copy that may already be deleted
// under our "cloud only stores it until delivered" model) to play it again.
const MediaStore={
  _dbp:null,
  _open(){
    if(this._dbp)return this._dbp;
    this._dbp=new Promise((resolve,reject)=>{
      const req=indexedDB.open('crizon-media',1);
      req.onupgradeneeded=()=>{req.result.createObjectStore('blobs');};
      req.onsuccess=()=>resolve(req.result);
      req.onerror=()=>reject(req.error);
    });
    return this._dbp;
  },
  async set(id,blob){
    try{
      const db=await this._open();
      await new Promise((res,rej)=>{
        const tx=db.transaction('blobs','readwrite');
        tx.objectStore('blobs').put(blob,id);
        tx.oncomplete=res;tx.onerror=()=>rej(tx.error);
      });
    }catch{}
  },
  async get(id){
    try{
      const db=await this._open();
      return await new Promise((res,rej)=>{
        const tx=db.transaction('blobs','readonly');
        const rq=tx.objectStore('blobs').get(id);
        rq.onsuccess=()=>res(rq.result||null);
        rq.onerror=()=>rej(rq.error);
      });
    }catch{return null;}
  },
};
// For any media message not yet in the in-memory mediaCache: check the
// persistent local store first (instant, no network); only if it's genuinely
// not been seen on this device yet, and it's an incoming message, fall back
// to downloading it (autoDownload, defined further down). Safe to call
// repeatedly — it no-ops once cached or already in flight.
async function ensureLocalMedia(m){
  if(!m||!m.id||mediaCache.has(m.id))return;
  const blob=await MediaStore.get(m.id);
  if(blob){
    mediaCache.set(m.id,URL.createObjectURL(blob));
    if(S.screen==='chat'){try{renderMsgsGlobal();}catch{}}
    return;
  }
  if(sameUser(m.to,S.user.username)) autoDownload(m);
}
// Simple localStorage read-through cache so chat list / chat screens paint
// instantly from what was last seen, instead of waiting on a fresh Firestore
// round-trip every time. Firestore stays the source of truth — this cache is
// just what's shown first, and gets overwritten as soon as live data arrives.
const LocalCache={
  get(key){try{const v=localStorage.getItem(key);return v?JSON.parse(v):null;}catch{return null;}},
  set(key,val){try{localStorage.setItem(key,JSON.stringify(val));}catch{}},
};
const downloadingNow = new Set();
async function autoDownload(m){
  if(!m || !m.url) return;
  if(m.type!=='image' && m.type!=='video' && m.type!=='audio') return;
  if(mediaCache.has(m.id) || downloadingNow.has(m.id)) return;
  downloadingNow.add(m.id);
  try{
    const res = await fetch(m.url);
    if(!res.ok) throw new Error('fail');
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    mediaCache.set(m.id, url);
    await MediaStore.set(m.id, blob); // persist so this survives app restart / chat reopen
    BW.add(Math.ceil(blob.size/1048576));
    if(m.publicId) clDelete(m.publicId, m.resourceType || (m.type==='image'?'image':'video'));
    if(S.screen==='chat') { try{ renderMsgsGlobal(); }catch{} }
  }catch{}
  downloadingNow.delete(m.id);
}
let renderMsgsGlobal = ()=>{};

// Saves an image/video to the device gallery. Uses the native Capacitor Media
// plugin when running as an app (real gallery save, like WhatsApp's download
// icon); falls back to a browser download when running as a plain web page.
// The plugin itself is bundled locally as native-bridge.js (see src/native-bridge-src.js)
// instead of being fetched from a CDN at runtime, so it always matches the
// exact native plugin version wired up by `cap sync` — no silent version/path
// mismatches.
async function saveToGallery(url, type){
  try{
    const bridge = window.NativeBridge;
    if(bridge && bridge.isNative && bridge.isNative()){
      const res = await fetch(url); const blob = await res.blob();
      const dataUrl = await new Promise((resolve,reject)=>{const fr=new FileReader();fr.onloadend=()=>resolve(fr.result);fr.onerror=reject;fr.readAsDataURL(blob);});
      await bridge.saveToGallery(dataUrl, type==='video');
      toast('Saved to gallery');
      return;
    }
    const a=document.createElement('a');a.href=url;a.download=`crizon_${Date.now()}`;a.click();
    toast('Downloaded');
  }catch(e){
    const detail=e&&(e.message||e.code||(typeof e==='string'?e:''));
    toast(detail?`Could not save: ${detail}`:'Could not save to gallery',4000);
  }
}

        cred = await Promise.race([
          signInWithEmailAndPassword(auth, em, p),
          new Promise((_,rej)=>setTimeout(()=>rej(Object.assign(new Error('Sign-in timed out. Please check your internet connection.'),{code:'auth/network-request-failed'})),10000))
        ]);
        break;
      }
      catch(e){ lastErr = e; const code = e.code || '';
        if(code === 'auth/configuration-not-found' || code === 'auth/network-request-failed' || code === 'auth/too-many-requests') break;
        if(code === 'auth/wrong-password') wrongPwDetected = true;
      }
    }
    if(!cred){
      const code = lastErr?.code || '';
      let msg;
      if(code === 'auth/configuration-not-found') msg = 'Authentication is not configured.';
      else if(code === 'auth/network-request-failed') msg = 'Network error. Check your connection.';
      else if(code === 'auth/too-many-requests') msg = 'Too many attempts. Please wait a minute.';
      else if(wrongPwDetected || code === 'auth/invalid-credential') msg = 'Incorrect username or password.';
      else if(code === 'auth/user-not-found') msg = 'No account found with this username.';
      else msg = lastErr?.message || 'Sign-in failed. Please try again.';
      toast(msg, 5500); b.disabled = false; b.textContent = 'Log In'; return;
    }
    const uid = cred.user.uid;
    try {
      const s = await getDoc(doc(db,'users',uid));
      let userData;
      if(s.exists()){ const d = s.data(); userData = { uid, name: d.name, username: d.username, profileUrl: d.profileUrl || '' }; }
      else { const nm = stripped.charAt(0).toUpperCase() + stripped.slice(1);
        userData = { uid, name: nm, username: full, profileUrl: '' };
        await setDoc(doc(db,'users',uid),{ uid, name: nm, username: full, email: cred.user.email || '', profileUrl:'', contacts:[], createdAt: Date.now() }); }
      S.user = userData; Session.save(S.user); setOnline(uid); claimSession(uid);
      historyInitialized = true; history.replaceState({screen:'chatList',params:{}},'',location.pathname+location.search);
      nav('chatList',{},false);
    } catch(e) { toast('Could not load user data.', 5000); b.disabled = false; b.textContent = 'Log In'; }
  };
  $('#lgP').addEventListener('keydown', e => { if(e.key === 'Enter') $('#lgBtn').click(); });
}

function setOnline(uid){if(!uid)return;try{const p=rtdbRef(rtdb,`presence/${uid}`);rtdbUpdate(p,{online:true,lastSeen:Date.now()});onDisconnect(p).set({online:false,lastSeen:serverTimestamp()});}catch{}}

/* ===== Single-device session enforcement (WhatsApp-style: one login at a time) ===== */
let mySessionId=null, sessionUnsub=null;
const genSessionId=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
async function claimSession(uid){
  mySessionId=genSessionId();
  try{await rtdbSet(rtdbRef(rtdb,`sessions/${uid}`),mySessionId);}catch{}
  if(sessionUnsub){try{sessionUnsub();}catch{}}
  const sref=rtdbRef(rtdb,`sessions/${uid}`);
  sessionUnsub=onValue(sref,snap=>{
    const v=snap.val();
    // A different device claimed this account (or came back online after
    // claiming it while we were offline) — log this device out, like WhatsApp.
    if(v&&mySessionId&&v!==mySessionId) forceLogout();
  });
}
async function forceLogout(){
  if(sessionUnsub){try{sessionUnsub();}catch{}sessionUnsub=null;}
  const uid=S.user?.uid;
  try{await signOut(auth);}catch{}
  Session.clear();S.user=null;mySessionId=null;
  if(uid)try{setOffline(uid);}catch{}
  toast('Logged out — this account was opened on another device',5000);
  historyInitialized=true;history.replaceState({screen:'login',params:{}},'',location.pathname+location.search);
  nav('login',{},false);
}
window.addEventListener('beforeunload',()=>{if(S.user)setOffline(S.user.uid);});
document.addEventListener('visibilitychange',()=>{if(!S.user)return;if(document.hidden)setOffline(S.user.uid);else setOnline(S.user.uid);});

    <div class="fab-stack"><button class="fab-small" id="fabAI">${ICONS.pencil}</button><button class="fab" id="fabNew">${ICONS.plus}</button></div>
    <div class="bottom-nav"><button class="nav-item active">${ICONS.chatsNav}<span>Chats</span></button><button class="nav-item" id="navAI">${ICONS.sparkle}<span>AI</span></button><button class="nav-item" id="navPr">${ICONS.gearNav}<span>Settings</span></button></div>
  </div>`;

  let filter='all',sq='',rows=[];
  const threadUnsubs=new Map(),presenceUnsubs=new Map();
  let syncing=false,pendingContacts=null;
  const chatListCacheKey=`crizon_chatlist_${S.user.uid}`;

  $('#srchTog').onclick=()=>{const sb=$('#srchBar');sb.classList.toggle('active');if(sb.classList.contains('active'))$('#srchIn').focus();};
  $('#srchX').onclick=()=>{$('#srchBar').classList.remove('active');$('#srchIn').value='';sq='';draw();};
  $('#srchIn').oninput=e=>{sq=e.target.value.trim().toLowerCase();draw();};
  $$('.filter-pill').forEach(p=>p.onclick=()=>{$$('.filter-pill').forEach(x=>x.classList.remove('active'));p.classList.add('active');filter=p.dataset.f;draw();});
  $('#fabAI').onclick=()=>nav('aiChat');$('#navAI').onclick=()=>nav('aiChat');$('#fabNew').onclick=()=>nav('newChat');$('#navPr').onclick=()=>nav('profile');$('#menuTog').onclick=()=>nav('profile');

  const draw=()=>{
    const body=$('#clBody');if(!body)return;
    const vis=rows.filter(r=>{if(filter==='unread'&&!(r.unread>0))return false;if(sq)return (r.contact.name||'').toLowerCase().includes(sq)||(r.contact.username||'').toLowerCase().includes(sq);return true;});
    vis.sort((a,b)=>(b.lastCreatedAt||0)-(a.lastCreatedAt||0));
    $('#cntAll').textContent=rows.length;$('#cntUnr').textContent=rows.filter(r=>r.unread>0).length;
    if(!vis.length){body.innerHTML=`<div class="empty-chats"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><p>${sq?'No chats found':'No conversations yet.<br>Tap <b>+</b> to start a new chat.'}</p></div>`;return;}
    body.innerHTML=vis.map(r=>{const av=r.contact.profileUrl?`<img src="${esc(r.contact.profileUrl)}">`:initials(r.contact.name);let previewIcon='';if(r.lastMessageFromMe&&r.lastStatus){if(r.lastStatus==='read')previewIcon=`<span class="preview-tick read">${ICONS.doubleTick}</span>`;else if(r.lastStatus==='delivered')previewIcon=`<span class="preview-tick">${ICONS.doubleTick}</span>`;else previewIcon=`<span class="preview-tick">${ICONS.singleTick}</span>`;}return `<div class="chat-item ${r.unread>0?'unread':''}" data-uid="${esc(r.contact.uid)}"><div class="chat-avatar" style="background:${r.contact.profileUrl?'transparent':gradCss(r.contact.username)}">${av}</div><div class="chat-info"><div class="chat-top-row"><span class="chat-name">${esc(r.contact.name)}</span><span class="chat-time">${r.lastTime||''}</span></div><div class="chat-bottom-row"><span class="chat-preview ${r.unread>0?'unread':''}">${previewIcon}${r.lastMessage||''}</span>${r.unread>0?`<span class="unread-badge">${r.unread}</span>`:''}</div></div></div>`;}).join('');
    $$('.chat-item',body).forEach(it=>it.onclick=()=>{const row=rows.find(x=>x.contact.uid===it.dataset.uid);if(row)nav('chat',{contact:row.contact});});
    LocalCache.set(chatListCacheKey,rows);
  };

  const subscribeThread=contact=>{
    if(threadUnsubs.has(contact.uid))return;
    const cid=chatId(S.user.username,contact.username);
    const q=query(collection(db,'messages',cid,'thread'),orderBy('createdAt','desc'),limit(100));
    const unsub=onSnapshot(q,snap=>{
      const list=[];snap.forEach(d=>{const m={id:d.id,...d.data()};if(!(Array.isArray(m.deletedFor)&&m.deletedFor.some(x=>sameUser(x,S.user.username))))list.push(m);});
      list.sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
      const row=rows.find(x=>x.contact.uid===contact.uid);if(!row)return;
      if(list.length){const last=list[list.length-1];row.lastMessage=last.type==='text'?esc(last.content):(last.type==='image'?'Photo':last.type==='video'?'Video':last.type==='audio'?'Voice message':'Document');row.lastTime=timeAgo(last.createdAt);row.lastCreatedAt=last.createdAt||0;row.lastMessageFromMe=sameUser(last.from,S.user.username);row.lastStatus=last.status||'sent';row.unread=list.reduce((n,m)=>n+(sameUser(m.to,S.user.username)&&m.status!=='read'?1:0),0);}else{row.lastMessage='';row.lastTime='';row.lastCreatedAt=0;row.unread=0;row.lastMessageFromMe=false;}
      draw();
      list.forEach(m=>{if(sameUser(m.to,S.user.username)&&m.status==='sent')updateDoc(doc(db,'messages',cid,'thread',m.id),{status:'delivered'}).catch(()=>{});});
    },err=>console.warn('thread',err));
    threadUnsubs.set(contact.uid,unsub);S.unsubs.push(()=>{try{unsub();}catch{}});
  };

  const subscribePresence=contact=>{
    if(presenceUnsubs.has(contact.uid))return;
    const pref=rtdbRef(rtdb,`presence/${contact.uid}`);
    const u=onValue(pref,snap=>{const row=rows.find(x=>x.contact.uid===contact.uid);if(row){const v=snap.val()||{};const next=!!v.online;if(row.online!==next){row.online=next;draw();}}});
    presenceUnsubs.set(contact.uid,u);S.unsubs.push(()=>{try{off(pref,'value',u);}catch{}});
  };

  const syncContacts=async unames=>{
    if(syncing){pendingContacts=Array.isArray(unames)?unames.slice():[];return;}
    syncing=true;
    try{
      const wanted=(Array.isArray(unames)?unames:[]).filter(Boolean);
      if(!wanted.length){rows=[];draw();return;}
      // One users read instead of many sequential username queries.
      const allSnap=await getDocs(collection(db,'users'));
      const byUsername=new Map();allSnap.forEach(d=>{const x=d.data();if(x.username)byUsername.set(String(x.username).toLowerCase(),{uid:d.id,...x});});
      const old=new Map(rows.map(r=>[r.contact.uid,r]));
      rows=wanted.map(u=>byUsername.get(String(u).toLowerCase())).filter(Boolean).filter(c=>!sameUser(c.username,S.user.username)).map(c=>old.get(c.uid)||{contact:{uid:c.uid,name:c.name,username:c.username,profileUrl:c.profileUrl||''},lastMessage:'',lastTime:'',lastCreatedAt:0,unread:0,online:false,lastMessageFromMe:false,lastStatus:'sent'});
      draw();
      rows.forEach(r=>{subscribeThread(r.contact);});
    }catch(e){console.error(e);draw();}finally{
      syncing=false;
      if(pendingContacts!==null){const next=pendingContacts;pendingContacts=null;void syncContacts(next);}
    }
  };

  // Paint instantly from what we last saw (no network wait), then let the
  // Firestore listeners below refresh it with live data in the background.
  const cachedRows=LocalCache.get(chatListCacheKey);
  if(Array.isArray(cachedRows)&&cachedRows.length){rows=cachedRows;draw();}

  // Live-listen to the current user's contacts so a newly received message creates a chat immediately.
  const meRef=doc(db,'users',S.user.uid);
  const meUnsub=onSnapshot(meRef,snap=>{syncContacts(snap.data()?.contacts||[]);},()=>{});
  S.unsubs.push(()=>{try{meUnsub();}catch{}});
  // Also do one immediate load so the first paint does not wait for another event loop.
  getDoc(meRef).then(snap=>syncContacts(snap.data()?.contacts||[])).catch(()=>draw());
}

  let currentMsgs=[];

    w.querySelectorAll('[data-seek]').forEach(el=>{

  let fsCurrent=null;

    if(m.type==='image'){

      const img=content.querySelector('img');

      const apply=()=>{img.style.transform=`translate3d(${tx}px,${ty}px,0) scale(${scale})`;};
      const reset=()=>{scale=1;tx=0;ty=0;apply();};

      },{passive:false});

        if(e.touches.length===0){
          startDist=0;
          const now=Date.now();if(now-lastTap<300){toggleZoom();}lastTap=now;
          if(scale<=1){tx=0;ty=0;apply();}
        }
      });
      img._resetZoom=reset;
    }else if(m.type==='video')content.innerHTML=`<video src="${esc(url)}" controls autoplay playsinline></video>`;
    fs.classList.add('active');
  };
  const closeFs=()=>{const fs=$('#fsMedia');fs.classList.remove('active');$('#fsContent').innerHTML='';fsCurrent=null;};
  $('#fsClose').onclick=closeFs;
  $('#fsSave').onclick=()=>{if(fsCurrent)saveToGallery(fsCurrent.url,fsCurrent.type);};
  $('#fsMedia').onclick=e=>{if(e.target.id==='fsMedia')closeFs();};

  let curAudio=null;
  const fmtTime=s=>{s=Math.max(0,Math.floor(s||0));return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;};
  const updateVoiceUI=id=>{
    if(!curAudio||curAudio.dataset.id!==id)return;
    const w=$('#chatArea');if(!w)return;
    const fill=w.querySelector(`[data-fill="${id}"]`);const thumb=w.querySelector(`[data-thumb="${id}"]`);const label=w.querySelector(`[data-durlabel="${id}"]`);
    if(!fill||!thumb||!label)return;
    const dur=curAudio.duration||0;const pct=dur?Math.min(100,(curAudio.currentTime/dur)*100):0;
    fill.style.width=pct+'%';thumb.style.left=pct+'%';
    label.textContent=`${fmtTime(curAudio.currentTime)} / ${fmtTime(dur)}`;
  };
  const resetVoiceUI=id=>{
    const w=$('#chatArea');if(!w)return;
    const fill=w.querySelector(`[data-fill="${id}"]`);const thumb=w.querySelector(`[data-thumb="${id}"]`);const label=w.querySelector(`[data-durlabel="${id}"]`);
    const m=currentMsgs.find(x=>x.id===id);
    if(fill)fill.style.width='0%';if(thumb)thumb.style.left='0%';
    if(label&&m)label.textContent=m.duration?fmtTime(m.duration):'0:00';
  };
  const playVoice=(id,btn)=>{
    const m=currentMsgs.find(x=>x.id===id);if(!m)return;
    const url=mediaCache.get(m.id)||m.url;
    if(!url){toast('Audio not ready');return;}
    if(curAudio&&curAudio.dataset.id===id){
      if(curAudio.paused){curAudio.play();btn.innerHTML=ICONS.pause;}else{curAudio.pause();btn.innerHTML=ICONS.play;}
      return;
    }
    if(curAudio){curAudio.pause();resetVoiceUI(curAudio.dataset.id);}
    const a=new Audio(url);a.dataset.id=id;a.playbackRate=voiceRates.get(id)||1;
    a.addEventListener('timeupdate',()=>updateVoiceUI(id));
    a.addEventListener('loadedmetadata',()=>updateVoiceUI(id));
    a.onended=()=>{btn.innerHTML=ICONS.play;resetVoiceUI(id);};
    a.play();btn.innerHTML=ICONS.pause;curAudio=a;
  };
  const seekVoice=(id,ratio)=>{
    if(!curAudio||curAudio.dataset.id!==id){
      const w=$('#chatArea');const btn=w?.querySelector(`[data-play="${id}"]`);
      if(btn)playVoice(id,btn);
    }
    if(curAudio&&curAudio.dataset.id===id&&curAudio.duration){
      curAudio.currentTime=ratio*curAudio.duration;updateVoiceUI(id);
    }
  };
  const cycleSpeed=id=>{
    const order=[1,1.5,2];const cur=voiceRates.get(id)||1;const next=order[(order.indexOf(cur)+1)%order.length];
    voiceRates.set(id,next);
    if(curAudio&&curAudio.dataset.id===id)curAudio.playbackRate=next;
    const w=$('#chatArea');const btn=w?.querySelector(`[data-speed="${id}"]`);
    if(btn)btn.textContent=next+'x';
  };

  const threadCacheKey=`crizon_thread_${cid}`;
  // Paint instantly from the last-seen copy of this chat, then let Firestore
  // refresh it in the background — this is what removes the "chat opens
  // blank and pops in a second later" delay.
  const cachedMsgs=LocalCache.get(threadCacheKey);
  if(Array.isArray(cachedMsgs)&&cachedMsgs.length){
    currentMsgs=cachedMsgs;renderMsgs(cachedMsgs);
    const w0=$('#chatArea');if(w0)setTimeout(()=>{w0.scrollTop=w0.scrollHeight;},30);
  }

  let inited=false;
  const unsub=onSnapshot(query(threadRef,orderBy('createdAt','asc')),snap=>{
    const list=[];snap.forEach(d=>list.push({id:d.id,...d.data()}));currentMsgs=list;renderMsgs(list);
    LocalCache.set(threadCacheKey,list.slice(-200));
    const w=$('#chatArea');if(w){if(inited){if(w.scrollHeight-w.scrollTop-w.clientHeight<200)w.scrollTop=w.scrollHeight;}else{inited=true;setTimeout(()=>{w.scrollTop=w.scrollHeight;},60);}}
    list.forEach(m=>{
      // Mark incoming as READ since chat is open
      if(sameUser(m.to,S.user.username) && m.status!=='read'){
        updateDoc(doc(db,'messages',cid,'thread',m.id),{status:'read'}).catch(()=>{});
      }
      // Auto-download media for incoming messages so it lands in local storage
      // and clears out of the cloud, same as the delivery model we agreed on.
      if(sameUser(m.to,S.user.username)) autoDownload(m);
    });
  },err=>console.error(err));
  S.unsubs.push(()=>{try{unsub();}catch{}});

  const inp=$('#msgIn');
  const actBtn=$('#actBtn');
  const updateActIcon=()=>{actBtn.innerHTML=inp.value.trim()?ICONS.send:ICONS.mic;};
  const resizeInput=()=>{inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,100)+'px';};
  updateActIcon();resizeInput();
  inp.addEventListener('input',()=>{updateActIcon();resizeInput();});
  const sendText=async()=>{const t=inp.value.trim();if(!t)return;inp.value='';updateActIcon();resizeInput();try{await addDoc(threadRef,{from:S.user.username,to:contact.username,type:'text',content:t,createdAt:Date.now(),status:'sent'});void ensureChatContact(contact);}catch(e){toast('Could not send message');}};

  let rec=null,chunks=[],recT=null,sec=0;
  const recBar=$('#recBar');
  const startRec=async()=>{
    try{
      const stream=await navigator.mediaDevices.getUserMedia({audio:true});
      const mt=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':MediaRecorder.isTypeSupported('audio/webm')?'audio/webm':MediaRecorder.isTypeSupported('audio/mp4')?'audio/mp4':'';
      rec=new MediaRecorder(stream,mt?{mimeType:mt}:undefined);
      chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};rec.start();
      sec=0;$('#recTime').textContent='0:00';
      recT=setInterval(()=>{sec++;$('#recTime').textContent=`${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;if(sec>=300)stopRec(true);},1000);
      recBar.classList.add('active');
    }catch{toast('Microphone access required');}
  };
  const stopRec=send=>{
    if(rec&&rec.state!=='inactive'){
      rec.onstop=async()=>{
        recBar.classList.remove('active');clearInterval(recT);rec.stream.getTracks().forEach(t=>t.stop());
        if(send&&chunks.length){
          const blob=new Blob(chunks,{type:'audio/webm'});const file=new File([blob],`voice_${Date.now()}.webm`,{type:'audio/webm'});
          await sendMedia('audio',file,'',sec);
        }
        rec=null;
      };
      rec.stop();
    }
  };
  $('#recX').onclick=()=>stopRec(false);
  $('#recGo').onclick=()=>stopRec(true);
  actBtn.onclick=()=>{if(inp.value.trim())sendText();else startRec();};

  const sendMedia=async(type,file,caption,dur=0)=>{
    const mb=(file.size||0)/1048576;
    if(mb>CFG.app.maxUploadMB){toast(`File too large (max ${CFG.app.maxUploadMB} MB)`);return;}
    if(!BW.can(mb)){toast('Monthly bandwidth limit reached');return;}
    try{
      const up=await clUpload(file,()=>{});BW.add(Math.ceil(up.bytes/1048576));
      // Pre-generate the doc ref and cache the local file BEFORE writing to
      // Firestore. If we cached it only after addDoc() resolved, there was a
      // race: Firestore's own local echo of the write could reach the
      // on-snapshot listener (and render this bubble) before our cache line
      // ran, leaving it stuck on the loading spinner forever. Caching first
      // means the very first render this message ever gets already finds it.
      const ref=doc(threadRef);
      mediaCache.set(ref.id, URL.createObjectURL(file));
      MediaStore.set(ref.id, file); // persist so this survives app restart, not just this session
      await setDoc(ref,{from:S.user.username,to:contact.username,type,url:up.url,publicId:up.publicId,resourceType:up.resourceType,size:up.bytes,duration:dur,content:caption||'',fileName:file.name,createdAt:Date.now(),status:'sent'});
      void ensureChatContact(contact);
    }catch(e){toast('Upload failed. Please try again.');}
  };

  let pendType=null;
  $$('.attach-row').forEach(r=>r.onclick=()=>{
    pendType=r.dataset.t;$('#attModal').classList.remove('active');
    const fp=$('#fp');fp.value='';fp.accept=pendType==='image'?'image/*':pendType==='video'?'video/*':'*/*';fp.click();
  });
  $('#fp').onchange=e=>{const f=e.target.files[0];if(!f)return;if(pendType==='image'||pendType==='video')showPv(f,pendType);else sendMedia('file',f,'');};

  let pvFile=null,pvType=null;
  const pvM=$('#pvM');
  const showPv=(f,t)=>{pvFile=f;pvType=t;const u=URL.createObjectURL(f);const b=$('#pvB');if(t==='image')b.innerHTML=`<img src="${u}">`;else b.innerHTML=`<video src="${u}" controls autoplay></video>`;$('#pvT').textContent=t==='image'?'Send photo':'Send video';$('#pvC').value='';pvM.classList.add('active');};
  $('#pvX').onclick=()=>{pvM.classList.remove('active');pvFile=null;};
  $('#pvG').onclick=async()=>{
    if(!pvFile)return;const c=$('#pvC').value.trim();const f=pvFile,t=pvType;pvFile=null;pvM.classList.remove('active');
    let d=0;if(t==='video')d=await getVidDur(f);
    await sendMedia(t,f,c,d);
  };
  const getVidDur=f=>new Promise(res=>{const v=document.createElement('video');v.preload='metadata';v.onloadedmetadata=()=>{URL.revokeObjectURL(v.src);res(Math.round(v.duration||0));};v.onerror=()=>res(0);v.src=URL.createObjectURL(f);});

  // On open, immediately mark all incoming as read (for messages already there)
  try{const un=await getDocs(query(threadRef,where('to','==',S.user.username),where('status','!=','read')));if(!un.empty){const b=writeBatch(db);un.forEach(d=>b.update(d.ref,{status:'read'}));await b.commit();}}catch{}

  $('#mnClear').onclick=async()=>{
    $('#ctxM').classList.remove('active');
    if(!(await showConfirm('Delete all messages in this chat?',{okText:'Delete',danger:true})))return;
    try{const all=await getDocs(threadRef);const b=writeBatch(db);all.forEach(d=>b.delete(d.ref));await b.commit();}catch{toast('Could not clear chat');}
  };
}

  const cropCanvas=$('#cropCanvas'),cropCtx=cropCanvas.getContext('2d'),cropStage=$('#cropStage'),cropZoom=$('#cropZoom');
  const drawCrop=()=>{
    if(!cropImage)return;
    const W=cropCanvas.width,H=cropCanvas.height;
    cropCtx.clearRect(0,0,W,H);cropCtx.fillStyle='#111';cropCtx.fillRect(0,0,W,H);
    const base=Math.max(W/cropImage.width,H/cropImage.height);
    const scale=base*cropScale;
    const dw=cropImage.width*scale,dh=cropImage.height*scale;
    const dx=(W-dw)/2+cropXPos,dy=(H-dh)/2+cropYPos;
    cropCtx.drawImage(cropImage,dx,dy,dw,dh);
  };
  const resetCrop=()=>{cropScale=1;cropXPos=0;cropYPos=0;cropZoom.value='1';drawCrop();};
  const closeCrop=()=>{ $('#cropM').classList.remove('active'); if(cropObjectUrl){URL.revokeObjectURL(cropObjectUrl);cropObjectUrl=null;} cropImage=null; };
  const openCrop=async file=>{
    if(!file.type.startsWith('image/'))return toast('Please select an image');
    try{
      cropObjectUrl=URL.createObjectURL(file);cropImage=new Image();
      cropImage.onload=()=>{resetCrop();$('#cropM').classList.add('active');};
      cropImage.onerror=()=>{closeCrop();toast('Could not open photo');};
      cropImage.src=cropObjectUrl;
    }catch{toast('Could not open photo');}
  };
  const stagePoint=e=>{const r=cropStage.getBoundingClientRect();return {x:(e.clientX-r.left)*(cropCanvas.width/r.width),y:(e.clientY-r.top)*(cropCanvas.height/r.height)};};
  cropZoom.oninput=()=>{cropScale=parseFloat(cropZoom.value)||1;drawCrop();};
  cropStage.addEventListener('pointerdown',e=>{cropStage.setPointerCapture?.(e.pointerId);cropDrag=true;const p=stagePoint(e);cropLastX=p.x;cropLastY=p.y;});
  cropStage.addEventListener('pointermove',e=>{if(!cropDrag)return;const p=stagePoint(e);cropXPos+=p.x-cropLastX;cropYPos+=p.y-cropLastY;cropLastX=p.x;cropLastY=p.y;drawCrop();});
  cropStage.addEventListener('pointerup',()=>{cropDrag=false;});
  cropStage.addEventListener('pointercancel',()=>{cropDrag=false;});
  $('#picIn').onchange=async e=>{const f=e.target.files[0];if(f)await openCrop(f);e.target.value='';};

    try{

      const W=cropCanvas.width,H=cropCanvas.height;const base=Math.max(W/cropImage.width,H/cropImage.height);const scale=base*cropScale;
      const dw=cropImage.width*scale,dh=cropImage.height*scale;const dx=(W-dw)/2+cropXPos,dy=(H-dh)/2+cropYPos;
      const sx=Math.max(0,(-dx)/scale),sy=Math.max(0,(-dy)/scale),sw=Math.min(cropImage.width,(W/scale)),sh=Math.min(cropImage.height,(H/scale));
      ctx.drawImage(cropImage,sx,sy,sw,sh,0,0,400,400);
      const blob=await new Promise(resolve=>out.toBlob(resolve,'image/jpeg',0.9));
      if(!blob)throw new Error('crop failed');

    }catch{toast('Could not upload photo');}
  };
  $('#cpId').onclick=()=>{navigator.clipboard?.writeText(S.user.username);toast('Copied: '+S.user.username);};
  $('#edName').onclick=()=>{$('#nmD').value=S.user.name;$('#nmM').classList.add('active');};
  $('#nmM').onclick=e=>{if(e.target.id==='nmM')$('#nmM').classList.remove('active');};
  $('#nmX').onclick=()=>$('#nmM').classList.remove('active');
  $('#nmS').onclick=async()=>{const v=$('#nmD').value.trim();if(!v)return toast('Name cannot be empty');await updateDoc(doc(db,'users',S.user.uid),{name:v});S.user.name=v;Session.save(S.user);$('#nmM').classList.remove('active');toast('Name updated');nav('profile');};

}

/* ============ EXPIRY ============ */
async function sweepExpiry(){
  try{
    if(!S.user)return;
    const cutoff=Date.now()-CFG.app.offlineExpiryDays*24*60*60*1000;
    const me=await getDoc(doc(db,'users',S.user.uid));
    const cs=me.data()?.contacts||[];
    for(const other of cs){
      const cid=chatId(S.user.username,other);
      try{const snap=await getDocs(collection(db,'messages',cid,'thread'));for(const d of snap.docs){const m=d.data();if(m.createdAt&&m.createdAt<cutoff&&m.status==='sent'){try{await deleteDoc(d.ref);}catch{}}}}catch{}
    }
  }catch{}
}

    case 'newChat':return renderNewChat();
    case 'profile':return renderProfile();
    case 'contactProfile':return renderContactProfile();
    case 'aiChat':return renderAiChat();
    default:return renderLogin();
  }
}

onAuthStateChanged(auth,u=>{if(!u&&!['login','create','splash'].includes(S.screen)){Session.clear();S.user=null;}});

// render() itself calls window.NativeBridge.setBars(...) for the current
// screen — no separate boot-time call needed (that used to race with the
// first render()'s own call and sometimes lose, which is why the splash
// screen occasionally still showed teal instead of black).
render();
setTimeout(()=>{if(S.user)sweepExpiry();},3500);
</script>
</body>
